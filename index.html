<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xi-kki Builds</title>
<meta name="description" content="Websites built by Xi-kki: motion-rich, fast, hand-coded. Live demos.">
<meta property="og:title" content="Xi-kki Builds">
<meta property="og:description" content="Motion-rich websites, hand-coded. Live demos.">
<meta property="og:image" content="https://xi-kki.github.io/builds/shots/virtualfit.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f0; --ink:#121212; --muted:#6b6862; --line:rgba(18,18,18,.10); --card:#ffffff; --chip:rgba(18,18,18,.06);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0f;--ink:#f2f0ec;--muted:#9a968f;--line:rgba(255,255,255,.10);--card:#18181a;--chip:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg:#0e0e0f;--ink:#f2f0ec;--muted:#9a968f;--line:rgba(255,255,255,.10);--card:#18181a;--chip:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
header{padding:28px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:-.02em;font-size:18px}
.logo span{color:var(--muted);font-weight:500}
header nav{display:flex;gap:22px;font-size:14px;color:var(--muted)}
header nav a:hover{color:var(--ink)}
.hero{padding:88px 0 56px}
.hero h1{font-size:clamp(44px,8vw,104px);line-height:.92;letter-spacing:-.045em;font-weight:800;max-width:11ch}
.hero h1 em{font-style:normal;color:var(--muted)}
.hero p{margin-top:24px;max-width:46ch;color:var(--muted);font-size:17px;line-height:1.55}
.meta{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--chip)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:28px;padding:24px 0 96px}
.build{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .6s var(--ease),box-shadow .6s var(--ease)}
.build:hover{transform:translateY(-4px);box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.shot{aspect-ratio:16/10;overflow:hidden;background:var(--chip)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
.build:hover .shot img{transform:scale(1.04)}
.info{padding:20px 22px 22px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:start}
.info h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.info p{grid-column:1/-1;color:var(--muted);font-size:14px;line-height:1.5}
.go{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.go svg{transition:transform .5s var(--ease)}
.build:hover .go svg{transform:translateX(4px)}
.tags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags span{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.soon{display:grid;place-items:center;min-height:240px;border:1px dashed var(--line);border-radius:20px;color:var(--muted);font-size:14px}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wa{position:fixed;right:20px;bottom:20px;z-index:50;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 12px 30px -10px rgba(37,211,102,.7);transition:transform .5s var(--ease)}
.wa:hover{transform:scale(1.08)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
@media (max-width:600px){.wrap{padding:0 16px}.hero{padding:56px 0 36px}header nav{gap:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="./">Xi-kki <span>Builds</span></a>
    <nav><a href="#work">Work</a><a href="https://xi-kki.github.io/">Portfolio</a><a href="https://github.com/xi-kki">GitHub</a></nav>
  </header>

  <section class="hero">
    <h1 class="reveal">Websites that <em>move.</em></h1>
    <p class="reveal">Hand-coded, motion-rich sites with no templates or page builders. Every build is a live demo you can drag, scroll and click.</p>
    <div class="meta reveal"><span class="chip">Vanilla HTML/CSS/JS</span><span class="chip">60fps motion</span><span class="chip">Mobile-first</span><span class="chip">Live in 7–10 days</span></div>
  </section>

  <main id="work" class="grid"></main>

  <footer><span>© <span id="yr"></span> Xi-kki Builds</span><span>Want one? <a href="https://wa.me/2349066339975?text=Hi%20Xi-kki%2C%20I%27d%20like%20a%20website" target="_blank" rel="noopener" style="text-decoration:underline">Chat on WhatsApp</a></span></footer>
</div>
<a class="wa" href="https://wa.me/2349066339975?text=Hi%20Xi-kki%2C%20I%27d%20like%20a%20website" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg viewBox="0 0 32 32" width="28" height="28" fill="#fff" aria-hidden="true"><path d="M16.04 3C9.4 3 4 8.38 4 15c0 2.12.56 4.18 1.62 6L4 29l8.2-1.6A12.1 12.1 0 0 0 16.04 27C22.66 27 28 21.62 28 15S22.66 3 16.04 3zm0 21.8c-1.86 0-3.66-.5-5.24-1.44l-.38-.22-4.86.95.97-4.73-.25-.4A9.7 9.7 0 0 1 6.3 15c0-5.38 4.37-9.76 9.74-9.76 5.36 0 9.72 4.38 9.72 9.76s-4.36 9.8-9.72 9.8zm5.34-7.3c-.3-.15-1.73-.85-2-.95-.27-.1-.46-.15-.66.15-.2.3-.76.95-.93 1.14-.17.2-.34.22-.63.07-.3-.15-1.24-.46-2.37-1.46a8.9 8.9 0 0 1-1.64-2.04c-.17-.3-.02-.45.13-.6.13-.13.3-.34.44-.51.15-.17.2-.3.3-.49.1-.2.05-.37-.03-.52-.07-.15-.66-1.58-.9-2.17-.24-.57-.48-.49-.66-.5h-.56c-.2 0-.51.07-.78.37-.27.3-1.02 1-1.02 2.42s1.05 2.81 1.2 3c.15.2 2.06 3.14 5 4.4.7.3 1.24.48 1.67.62.7.22 1.34.19 1.84.12.56-.08 1.73-.7 1.97-1.38.25-.68.25-1.27.17-1.39-.07-.12-.27-.2-.56-.34z"/></svg>
</a>
<script>
// Add new builds here (newest first). shot = 1200px jpg in /shots
const BUILDS=[
  {slug:'kv-freight', title:'KV Freight Services', blurb:'Scroll-driven freight story: a reach stacker loads the truck, the camera pulls back, and the services slide past behind it.', tags:['Scroll-scrubbed video','Blend-mode type','Text sweep','Freight']},
  {slug:'virtualfit', title:'VirtualFit', note:'Concept demo', blurb:'Spatial try-on: glass garment cards orbit the model in a 3D arc, and a scan line sweeps each outfit on.', tags:['3D arc','Scan reveal','Glass UI','Drag + flick']},
  {slug:'oaks-school', url:'https://oaks-school.vercel.app/', title:'Oaks School', blurb:'School website for a Nigerian private school: programs, enrolment and contact, with a WhatsApp enquiry button.', tags:['Education','Enrolment funnel','Mobile-first']},
  {slug:'organaij', url:'https://organaij.carrd.co/', title:'Organaij', blurb:'Launch page for a fresh-produce brand that collects waitlist sign-ups ahead of the first harvest.', tags:['Food','Waitlist','Launch page']},
];
const grid=document.getElementById('work');
grid.innerHTML=BUILDS.map(b=>`
  <a class="build reveal" href="${b.url||'./'+b.slug+'/'}"${b.url?' target="_blank" rel="noopener"':''}>
    <div class="shot"><img src="shots/${b.slug}.jpg" alt="${b.title} screenshot" loading="lazy" width="1200" height="750"></div>
    <div class="info">
      <h2>${b.title}</h2>
      <span class="go">Live demo <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
      <p>${b.blurb}</p>
      <div class="tags">${b.tags.map(t=>`<span>${t}</span>`).join('')}</div>
    </div>
  </a>`).join('')+`<div class="soon reveal">Next build loading…</div>`;
document.getElementById('yr').textContent=new Date().getFullYear();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.transitionDelay=(i%4)*80+'ms';io.observe(el)});
</script>
</body>
</html>
