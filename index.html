<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xi-kki Builds</title>
<meta name="description" content="Websites built by Xi-kki: motion-rich, fast, hand-coded. Live demos.">
<meta property="og:title" content="Xi-kki Builds">
<meta property="og:description" content="Motion-rich websites, hand-coded. Live demos.">
<meta property="og:image" content="https://xi-kki.github.io/builds/shots/virtualfit.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f0; --ink:#121212; --muted:#6b6862; --line:rgba(18,18,18,.10); --card:#ffffff; --chip:rgba(18,18,18,.06);
  --ease:cubic-bezier(.2,.8,.2,1); --acc:#14a44d;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0f;--ink:#f2f0ec;--muted:#9a968f;--line:rgba(255,255,255,.10);--card:#18181a;--chip:rgba(255,255,255,.08);--acc:#3ddc84}}
:root[data-theme="dark"]{--bg:#0e0e0f;--ink:#f2f0ec;--muted:#9a968f;--line:rgba(255,255,255,.10);--card:#18181a;--chip:rgba(255,255,255,.08);--acc:#3ddc84}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
header{padding:28px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:-.02em;font-size:18px}
.logo span{color:var(--muted);font-weight:500}
header nav{display:flex;gap:22px;font-size:14px;color:var(--muted)}
header nav a:hover{color:var(--ink)}
.hero{padding:72px 0 64px;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"h h" "c s";gap:40px 48px;align-items:center}
.hero h1{grid-area:h}.hero .copy{grid-area:c;align-self:start}.hero .stack{grid-area:s}
.stack{position:relative;aspect-ratio:4/3.4}
.stack img{position:absolute;width:78%;height:auto;aspect-ratio:16/10;object-fit:cover;border-radius:14px;border:1px solid var(--line);box-shadow:0 24px 50px -24px color-mix(in srgb,var(--ink) 35%,transparent);transition:transform .6s var(--ease)}
.stack img:nth-child(1){left:0;top:0;transform:rotate(-4deg)}
.stack img:nth-child(2){right:0;top:22%;transform:rotate(3deg);z-index:1}
.stack img:nth-child(3){left:10%;bottom:0;transform:rotate(-1deg);z-index:2}
.stack:hover img:nth-child(1){transform:rotate(-6deg) translate(-8px,-6px)}
.stack:hover img:nth-child(2){transform:rotate(5deg) translate(8px,-4px)}
@media (max-width:860px){.hero{grid-template-columns:1fr;grid-template-areas:"h" "c" "s";gap:28px;padding:48px 0 40px}.stack{max-width:520px}}
.hero h1{font-size:clamp(30px,4.2vw,58px);line-height:1.06;letter-spacing:-.05em;font-weight:800}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:22px;display:flex;align-items:center;gap:10px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 var(--acc);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.beat{display:block;position:relative;width:fit-content;max-width:100%}
.beat .txt{display:inline-block;clip-path:inset(0 100% 0 0)}
.beat .bar{position:absolute;inset:.06em -.04em .02em;background:var(--ink);transform:scaleX(0);transform-origin:left}
.beat.paid .bar{background:var(--acc)}
.beat .lt{display:inline-block;color:var(--acc);white-space:pre}
.beat.muted .txt{color:var(--muted)}
@media (max-width:640px){.beat{width:auto}}
.kt .ln{display:block}
.kt .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .1em;margin-bottom:-.1em}
.kt .w>span{display:inline-block;font-weight:800}
.kt .from.past .w>span{font-weight:300;color:var(--muted)}
.kt .l2 .w>span{color:var(--acc)}
.kt .goal{position:relative;display:inline-block}
.kt .goal .w>span{font-weight:600}
.kt .goal.land .w>span{font-weight:900}
.kt .hl{position:absolute;left:-.08em;right:-.08em;bottom:.08em;height:.32em;background:color-mix(in srgb,var(--acc) 22%,transparent);border-radius:4px;transform:scaleX(0);transform-origin:left;z-index:-1}
.kt .goal{z-index:0}
@media (prefers-reduced-motion:reduce){.kt .from .w>span{font-weight:300;color:var(--muted)}.kt .goal .w>span{font-weight:900}.kt .hl{transform:none}}
.hero p{margin-top:28px;max-width:52ch;color:var(--muted);font-size:18px;line-height:1.6}
.hero p b{color:var(--ink);font-weight:600}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.btn.pri{background:var(--acc);color:#04120a}
.btn:active{transform:scale(.98)}
.btn.sec{border:1px solid var(--line)}
.btn:hover{transform:translateY(-2px)}
.path{padding:8px 0 72px;border-bottom:1px solid var(--line);margin-bottom:40px}
.path h2{font-size:clamp(24px,3vw,34px);font-weight:600;letter-spacing:-.03em}
.journey{margin-top:40px;position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding-top:34px}
.journey .rail{position:absolute;top:13px;left:10%;right:10%;height:2px;background:var(--line);border-radius:2px}
.journey .fill{position:absolute;inset:0;background:var(--acc);transform:scaleX(0);transform-origin:left;border-radius:2px}
.journey .pulse{position:absolute;top:-6px;left:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 22%,transparent)}
.step{text-align:center;position:relative}
.step .dot{position:absolute;top:-28px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--bg);border:2px solid var(--line);transition:background .3s,border-color .3s,transform .3s var(--ease)}
.step.on .dot{background:var(--acc);border-color:var(--acc);transform:scale(1.25)}
.step b{display:block;font-size:15px;font-weight:600;transition:color .3s}
.step span{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.step:not(.on) b{color:var(--muted)}
.step.last.on b{color:var(--acc)}
@media (max-width:700px){
  .journey{grid-template-columns:1fr;gap:18px;padding:0 0 0 34px}
  .journey .rail{top:6px;bottom:6px;left:7px;right:auto;width:2px;height:auto}
  .journey .fill{transform:scaleY(0);transform-origin:top}
  .journey .pulse{left:-6px!important;top:0;margin:0}
  .step{text-align:left}.step .dot{top:2px;left:-34px;margin:0}
}
@media (prefers-reduced-motion:reduce){.beat .txt{clip-path:none}.step .dot{background:var(--acc);border-color:var(--acc)}.step b{color:var(--ink)!important}.journey .pulse{display:none}}
.meta{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--chip)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:28px;padding:24px 0 96px}
.build{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .6s var(--ease),box-shadow .6s var(--ease)}
.build:hover{transform:translateY(-4px);box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.shot{aspect-ratio:16/10;overflow:hidden;background:var(--chip)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
.build:hover .shot img{transform:scale(1.04)}
.info{padding:20px 22px 22px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:start}
.info h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.info p{grid-column:1/-1;color:var(--muted);font-size:14px;line-height:1.5}
.go{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.go svg{transition:transform .5s var(--ease)}
.build:hover .go svg{transform:translateX(4px)}
.tags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags span{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.soon{display:grid;place-items:center;min-height:240px;border:1px dashed var(--line);border-radius:20px;color:var(--muted);font-size:14px}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wa{position:fixed;right:20px;bottom:20px;z-index:50;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 12px 30px -10px rgba(37,211,102,.7);transition:transform .5s var(--ease)}
.wa:hover{transform:scale(1.08)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
@media (max-width:600px){.wrap{padding:0 16px}.hero{padding:56px 0 36px}header nav{gap:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/">xi-kki/<span>builds</span></a>
    <nav><a href="#work">Work</a><a href="https://xi-kki.github.io/">Portfolio</a><a href="https://github.com/xi-kki">GitHub</a></nav>
  </header>

  <section class="hero">
      <h1 class="kt" aria-label="Websites that move you from where you are to where you want to be.">
        <span class="ln" aria-hidden="true"><span class="w"><span>Websites</span></span> <span class="w"><span>that</span></span> <span class="w"><span>move</span></span> <span class="w"><span>you</span></span> <span class="from"><span class="w"><span>from</span></span> <span class="w"><span>where</span></span> <span class="w"><span>you</span></span> <span class="w"><span>are</span></span></span></span>
        <span class="ln l2" aria-hidden="true"><span class="w"><span>to</span></span> <span class="w"><span>where</span></span> <span class="w"><span>you</span></span> <span class="goal"><span class="w"><span>want</span></span> <span class="w"><span>to</span></span> <span class="w"><span>be.</span></span><i class="hl"></i></span></span>
      </h1>
    <div class="copy">
      <p class="reveal">Turn searches into <b>WhatsApp sales</b>.</p>
      <div class="cta-row reveal"><a class="btn pri" href="https://wa.me/2349066339975?text=Hi%20Xi-kki%2C%20I%27d%20like%20a%20website%20that%20brings%20me%20customers" target="_blank" rel="noopener">Get my website</a><a class="btn sec" href="#work">See work</a></div>
    </div>
    <div class="stack reveal" aria-hidden="true">
      <img src="shots/tana-camps.jpg" alt="" width="1200" height="750">
      <img src="shots/virtualfit.jpg" alt="" width="1200" height="750">
      <img src="shots/kv-freight.jpg" alt="" width="1200" height="750">
    </div>
  </section>

  <section class="path">
    <h2>From search to sale.</h2>
    <div class="journey" id="journey" aria-label="How a website turns a search into a sale">
      <div class="rail"><div class="fill"></div><div class="pulse"></div></div>
      <div class="step"><i class="dot"></i><b>Search</b></div>
      <div class="step"><i class="dot"></i><b>Find</b></div>
      <div class="step"><i class="dot"></i><b>Trust</b></div>
      <div class="step"><i class="dot"></i><b>Message</b></div>
      <div class="step last"><i class="dot"></i><b>Paid</b></div>
    </div>
  </section>

  <main id="work" class="grid"></main>

  <footer><span>Â© <span id="yr"></span> Xi-kki Builds</span><span><a href="https://wa.me/2349066339975?text=Hi%20Xi-kki%2C%20I%27d%20like%20a%20website" target="_blank" rel="noopener" style="text-decoration:underline">Get my website</a></span></footer>
</div>
<a class="wa" href="https://wa.me/2349066339975?text=Hi%20Xi-kki%2C%20I%27d%20like%20a%20website" target="_blank" rel="noopener" aria-label="Get my website on WhatsApp">
  <svg viewBox="0 0 32 32" width="28" height="28" fill="#fff" aria-hidden="true"><path d="M16.04 3C9.4 3 4 8.38 4 15c0 2.12.56 4.18 1.62 6L4 29l8.2-1.6A12.1 12.1 0 0 0 16.04 27C22.66 27 28 21.62 28 15S22.66 3 16.04 3zm0 21.8c-1.86 0-3.66-.5-5.24-1.44l-.38-.22-4.86.95.97-4.73-.25-.4A9.7 9.7 0 0 1 6.3 15c0-5.38 4.37-9.76 9.74-9.76 5.36 0 9.72 4.38 9.72 9.76s-4.36 9.8-9.72 9.8zm5.34-7.3c-.3-.15-1.73-.85-2-.95-.27-.1-.46-.15-.66.15-.2.3-.76.95-.93 1.14-.17.2-.34.22-.63.07-.3-.15-1.24-.46-2.37-1.46a8.9 8.9 0 0 1-1.64-2.04c-.17-.3-.02-.45.13-.6.13-.13.3-.34.44-.51.15-.17.2-.3.3-.49.1-.2.05-.37-.03-.52-.07-.15-.66-1.58-.9-2.17-.24-.57-.48-.49-.66-.5h-.56c-.2 0-.51.07-.78.37-.27.3-1.02 1-1.02 2.42s1.05 2.81 1.2 3c.15.2 2.06 3.14 5 4.4.7.3 1.24.48 1.67.62.7.22 1.34.19 1.84.12.56-.08 1.73-.7 1.97-1.38.25-.68.25-1.27.17-1.39-.07-.12-.27-.2-.56-.34z"/></svg>
</a>
<script>
// Add new builds here (newest first). shot = 1200px jpg in /shots
const BUILDS=[
  {slug:'daisy', title:'Daisy Bakehouse', note:'Concept demo', blurb:'Cookie bakery shop: the bake scrubs with your scroll from flour to filled daisy cookies, a step tag follows each stage, then build-a-gift-box and a live cart.', tags:['Scroll video','Live cart','Gift builder','E-commerce']},
  {slug:'lakeshot', title:'Lakeshot', note:'Concept demo', blurb:'AI app-builder landing hero: a dawn lake video behind a glass prompt composer, measured to the pixel and rebuilt for tablet and phone.', tags:['Video hero','Glass composer','Staged entrance','SaaS']},
  {slug:'tana-camps', title:'Tana Camps Expeditions', note:'Concept demo', blurb:'Editorial safari species page: ELEPHANT rises letter by letter behind the elephant, the photo melts into cream paper, and every headline climbs in one letter at a time.', tags:['Letter reveals','Cut-out depth','Scroll melt','Travel']},
  {slug:'kv-freight', title:'KV Freight Services', blurb:'Scroll-driven freight story: a reach stacker loads the truck, the camera pulls back, and the services slide past behind it.', tags:['Scroll-scrubbed video','Blend-mode type','Text sweep','Freight']},
  {slug:'virtualfit', title:'VirtualFit', note:'Concept demo', blurb:'Spatial try-on: glass garment cards orbit the model in a 3D arc, and a scan line sweeps each outfit on.', tags:['3D arc','Scan reveal','Glass UI','Drag + flick']},
  {slug:'oaks-school', url:'https://oaks-school.vercel.app/', title:'Oaks School', blurb:'School website for a Nigerian private school: programs, enrolment and contact, with a WhatsApp enquiry button.', tags:['Education','Enrolment funnel','Mobile-first']},
  {slug:'organaij', url:'https://organaij.carrd.co/', title:'Organaij', blurb:'Launch page for a fresh-produce brand that collects waitlist sign-ups ahead of the first harvest.', tags:['Food','Waitlist','Launch page']},
  {slug:'kraiiv', url:'https://kraiiv.xyz/', title:'Kraiiv', blurb:'Launch site for a healthy-eating rewards app: scan, learn, earn. Video hero and an early-access waitlist.', tags:['Food-tech','Waitlist','Video hero']},
  {slug:'workreadyy', url:'https://workreadyy.vercel.app/', title:'WorkReadyy', blurb:'Community site for Nigerian professionals: soft-skills webinars, networking events and a one-tap join flow.', tags:['Community','Onboarding','Careers']},
  {slug:'cyberronin', url:'https://cyberonnin.netlify.app/', title:'CyberRonin', blurb:'Cyberpunk NFT collection landing page with neon type, glowing characters and wallet connect.', tags:['Web3','NFT','Neon UI']},
  {slug:'nytebook', title:'Nytebook', note:'Concept demo', blurb:'Nightlife booking landing: escrow-protected DJ and hypeman bookings, a spinning vinyl hero, scroll-lit how-it-works rail and animated reliability scores. Smooth on slow phones.', tags:['Kinetic type','Vinyl hero','Scroll rail','Score gauges']},
];
const grid=document.getElementById('work');
grid.innerHTML=BUILDS.map(b=>`
  <a class="build reveal" href="${b.url||'./'+b.slug+'/'}"${b.url?' target="_blank" rel="noopener"':''}>
    <div class="shot"><img src="shots/${b.slug}.jpg" alt="${b.title} screenshot" loading="lazy" width="1200" height="750"></div>
    <div class="info">
      <h2>${b.title}</h2>
      <span class="go">Live demo <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
      <p>${b.blurb}</p>
      <div class="tags">${b.tags.map(t=>`<span>${t}</span>`).join('')}</div>
    </div>
  </a>`).join('')+`<div class="soon reveal">Next build loadingâ€¦</div>`;
document.getElementById('yr').textContent=new Date().getFullYear();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
// kinetic headline: rise in, "where you are" fades to light/grey (left behind),
// "to where you want to be." travels in forward, lands heavy, highlight sweeps behind the goal
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches, O='cubic-bezier(.16,1,.3,1)';
(()=>{const h=document.querySelector('.kt'); if(!h)return;
  const l1=[...h.querySelectorAll('.ln:first-child .w>span')], l2=[...h.querySelectorAll('.l2 .w>span')];
  const from=h.querySelector('.from'), goal=h.querySelector('.goal'), hl=h.querySelector('.hl');
  if(calm){from.classList.add('past');goal.classList.add('land');return}
  l1.forEach((w,i)=>w.animate([{transform:'translateY(105%)'},{transform:'none'}],{duration:700,delay:120+i*70,easing:O,fill:'backwards'}));
  const t1=120+l1.length*70+500;
  const mut=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim(), ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
  from.querySelectorAll('.w>span').forEach((w,i)=>w.animate([{fontWeight:800,color:ink},{fontWeight:300,color:mut}],{duration:900,delay:t1+i*60,easing:O,fill:'forwards'}));
  l2.forEach((w,i)=>w.animate([{transform:'translateX(-.6em)',clipPath:'inset(0 100% 0 0)'},{transform:'none',clipPath:'inset(0 0 0 0)'}],{duration:650,delay:t1+250+i*90,easing:O,fill:'backwards'}));
  const t2=t1+250+l2.length*90+350;
  goal.querySelectorAll('.w>span').forEach((w,i)=>w.animate([{fontWeight:600},{fontWeight:900}],{duration:800,delay:t2+i*70,easing:O,fill:'forwards'}));
  hl.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:700,delay:t2+150,easing:O,fill:'forwards'});
})();
// customer journey: pulse travels the rail lighting each step, then resets
(()=>{const j=document.getElementById('journey'),steps=[...j.querySelectorAll('.step')],fill=j.querySelector('.fill'),pulse=j.querySelector('.pulse');
  if(calm){steps.forEach(s=>s.classList.add('on'));fill.style.transform='none';return}
  const vert=()=>matchMedia('(max-width:700px)').matches, STEP=900, N=steps.length;
  const run=()=>{steps.forEach(s=>s.classList.remove('on'));const v=vert(),T=STEP*(N-1);
    fill.animate([{transform:v?'scaleY(0)':'scaleX(0)'},{transform:'none'}],{duration:T,easing:'linear',fill:'forwards'});
    pulse.animate(v?[{top:'0%'},{top:'100%'}]:[{left:'0%'},{left:'100%'}],{duration:T,easing:'linear',fill:'forwards'});
    steps.forEach((s,i)=>setTimeout(()=>s.classList.add('on'),i*STEP));
    setTimeout(run,T+2600);};
  new IntersectionObserver((es,o)=>{if(es[0].isIntersecting){o.disconnect();setTimeout(run,1800)}}).observe(j);
})();
document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.transitionDelay=(i%4)*80+'ms';io.observe(el)});
</script>
</body>
</html>
